# Unofficial Windows, macOS and Linux (AppImage) packages of this fork (WMS templates via GDAL).
#
# Runs on manual dispatch (Actions tab -> "Build packages" -> "Run workflow")
# and on pushed tags named v* (e.g. v0.9.7-wms1). For tags, the packages are
# attached to a draft GitHub Release, which must be published manually.

name: Build packages

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  # Shown in Mapper's About dialog and used in package file names.
  VERSION_SUFFIX: wms

jobs:
  windows:
    name: Windows x64 (MSYS2 UCRT64)
    runs-on: windows-2022
    timeout-minutes: 120
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: git grep
          pacboy: >-
            toolchain:p cmake:p ninja:p doxygen:p
            qt5-base:p qt5-tools:p qt5-imageformats:p qt5-translations:p
            qt5-location:p qt5-sensors:p qt5-serialport:p
            gdal:p proj:p

      - name: Version
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            echo "MAPPER_VERSION_DISPLAY=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "MAPPER_VERSION_DISPLAY=0.9.7-${VERSION_SUFFIX}-dev-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi

      - name: Find Qt Assistant
        # Mapper looks for an executable named "assistant" next to Mapper.exe.
        run: |
          pacman -Ql mingw-w64-ucrt-x86_64-qt5-tools | grep -i assistant || true
          a=$(find /ucrt64 -iname 'assistant*.exe' 2>/dev/null | grep -vi qt6 | head -1)
          if [[ -n "$a" ]]; then
            t="$(cygpath -u "$RUNNER_TEMP")/assistant"
            mkdir -p "$t"
            cp "$a" "$t/assistant.exe"
            echo "ASSISTANT_ARGS=-DMapper_PACKAGE_ASSISTANT=ON -DQt5Help_ASSISTANT_EXECUTABLE=$(cygpath -m "$t/assistant.exe")" >> "$GITHUB_ENV"
            echo "Using $a"
          else
            echo "::warning::Qt Assistant not found, building without the help viewer"
            echo "ASSISTANT_ARGS=-DMapper_PACKAGE_ASSISTANT=OFF" >> "$GITHUB_ENV"
          fi

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          "-DMapper_VERSION_DISPLAY=${MAPPER_VERSION_DISPLAY}"
          -DMapper_PACKAGE_QT=ON
          -DMapper_PACKAGE_GDAL=ON
          -DMapper_PACKAGE_PROJ=ON
          ${ASSISTANT_ARGS}

      - name: Build
        run: cmake --build build

      - name: Package (ZIP)
        run: |
          cd build
          cpack -G ZIP
          ls -l *.zip

      - name: Check package contents
        run: |
          cd build
          zip=$(ls *.zip | head -1)
          unzip -l "$zip" > contents.txt
          for f in Mapper.exe Qt5Core.dll qwindows.dll proj.db gdalvrt.xsd; do
            grep -q "$f" contents.txt || { echo "::error::$f missing in $zip"; exit 1; }
          done
          grep -c '\.dll$' contents.txt

      - uses: actions/upload-artifact@v5
        with:
          name: mapper-windows-x64
          path: build/*.zip

  macos:
    name: macOS arm64 (conda-forge)
    runs-on: macos-15
    timeout-minutes: 120
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v5

      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: mapper
          channels: conda-forge
          conda-remove-defaults: true

      - name: Install dependencies
        run: >
          conda install -y
          cmake ninja doxygen pkg-config
          "qt-main=5.15"
          libgdal-core proj

      - name: Version
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            echo "MAPPER_VERSION_DISPLAY=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "MAPPER_VERSION_DISPLAY=0.9.7-${VERSION_SUFFIX}-dev-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi

      - name: Find Qt Assistant
        # Mapper looks for an executable named "Assistant" next to Mapper.
        run: |
          find "$CONDA_PREFIX" -iname 'assistant*' -not -name '*.qm' 2>/dev/null | head -10
          a=""
          for c in "$CONDA_PREFIX/bin/assistant" "$CONDA_PREFIX/bin/Assistant.app/Contents/MacOS/Assistant"; do
            [[ -x "$c" ]] && { a="$c"; break; }
          done
          if [[ -n "$a" ]]; then
            echo "ASSISTANT_ARGS=-DMapper_PACKAGE_ASSISTANT=ON -DQt5Help_ASSISTANT_EXECUTABLE=$a" >> "$GITHUB_ENV"
            echo "Using $a"
          else
            echo "::warning::Qt Assistant not found, building without the help viewer"
            echo "ASSISTANT_ARGS=-DMapper_PACKAGE_ASSISTANT=OFF" >> "$GITHUB_ENV"
          fi

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          "-DMapper_VERSION_DISPLAY=${MAPPER_VERSION_DISPLAY}"
          "-DCMAKE_PREFIX_PATH=${CONDA_PREFIX}"
          -DCMAKE_FIND_FRAMEWORK=LAST
          -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          "-DCMAKE_INSTALL_RPATH=${CONDA_PREFIX}/lib"
          "-DGDAL_DATA_DIR=${CONDA_PREFIX}/share/gdal"
          "-DPROJ_DATA_DIR=${CONDA_PREFIX}/share/proj"
          -DMapper_PACKAGE_QT=ON
          -DMapper_PACKAGE_GDAL=ON
          -DMapper_PACKAGE_PROJ=ON
          ${ASSISTANT_ARGS}

      - name: Build
        run: cmake --build build

      - name: Install into app bundle
        run: |
          # The install step copies the libraries into Mapper.app (fixup_bundle).
          cmake --install build --prefix "$PWD/stage"
          ls stage

      - name: Ad-hoc code signing
        # Required on Apple Silicon after the libraries were modified.
        run: codesign --force --deep --sign - stage/Mapper.app

      - name: Check bundle
        run: |
          app=stage/Mapper.app
          test -x "$app/Contents/MacOS/Mapper"
          find "$app" -name proj.db | grep -q . || { echo "::error::proj.db missing"; exit 1; }
          find "$app" -name gdalvrt.xsd | grep -q . || { echo "::error::GDAL data missing"; exit 1; }
          # No library may still point to the build machine's conda environment.
          if find "$app/Contents" -type f \( -name '*.dylib' -o -perm -u+x \) -print0 \
             | xargs -0 otool -L 2>/dev/null | grep -F "$CONDA_PREFIX"; then
            echo "::error::Bundle still references $CONDA_PREFIX"; exit 1
          fi
          codesign --verify --deep "$app"

      - name: Package (ZIP)
        run: |
          name="OpenOrienteering-Mapper-${MAPPER_VERSION_DISPLAY}-macOS-arm64.zip"
          ditto -c -k --keepParent stage/Mapper.app "$name"
          ls -l "$name"

      - uses: actions/upload-artifact@v5
        with:
          name: mapper-macos-arm64
          path: '*.zip'

  linux:
    name: Linux x86_64 (AppImage)
    # Oldest supported base, so that the AppImage runs on newer systems
    # (glibc 2.35: Ubuntu 22.04+, Linux Mint 21+, Debian 12+).
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build doxygen file \
            qtbase5-dev qtbase5-private-dev qtbase5-dev-tools qttools5-dev qttools5-dev-tools qt5-assistant \
            qtpositioning5-dev libqt5sensors5-dev libqt5serialport5-dev \
            qt5-image-formats-plugins qttranslations5-l10n \
            libgdal-dev gdal-data libproj-dev proj-data libpolyclipping-dev \
            libcups2-dev zlib1g-dev

      - name: Version
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            echo "MAPPER_VERSION_DISPLAY=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "MAPPER_VERSION_DISPLAY=0.9.7-${VERSION_SUFFIX}-dev-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi

      - name: Configure
        # GDAL and PROJ data go into the AppImage; Mapper finds them
        # relative to its executable.
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          -DCMAKE_INSTALL_PREFIX=/usr
          "-DMapper_VERSION_DISPLAY=${MAPPER_VERSION_DISPLAY}"
          -DMapper_PACKAGE_GDAL=ON
          -DMapper_PACKAGE_PROJ=ON
          -DMapper_PACKAGE_QT=OFF
          -DMapper_PACKAGE_ASSISTANT=OFF

      - name: Build
        run: cmake --build build

      - name: Install into AppDir
        run: DESTDIR="$PWD/AppDir" cmake --install build

      - name: Create AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          QMAKE: /usr/lib/qt5/bin/qmake
        run: |
          base=https://github.com/linuxdeploy
          wget -q "$base/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage"
          wget -q "$base/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage"
          chmod +x linuxdeploy*.AppImage
          export LINUXDEPLOY_OUTPUT_VERSION="$MAPPER_VERSION_DISPLAY"
          ./linuxdeploy-x86_64.AppImage --appdir AppDir \
            --executable AppDir/usr/bin/Mapper \
            --executable /usr/lib/qt5/bin/assistant \
            --desktop-file AppDir/usr/share/applications/Mapper.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/256x256/apps/Mapper.png \
            --plugin qt \
            --output appimage
          rm linuxdeploy*.AppImage
          ls -l *.AppImage

      - name: Check AppImage contents
        run: |
          app=$(ls OpenOrienteering*Mapper*.AppImage | head -1)
          mkdir check && cd check
          "../$app" --appimage-extract > /dev/null
          for f in usr/bin/Mapper usr/bin/assistant \
                   usr/share/openorienteering-mapper/proj/proj.db \
                   usr/share/openorienteering-mapper/gdal/gdalvrt.xsd; do
            test -e "squashfs-root/$f" || { echo "::error::$f missing in $app"; exit 1; }
          done
          ls squashfs-root/usr/lib | wc -l

      - uses: actions/upload-artifact@v5
        with:
          name: mapper-linux-x86_64
          path: OpenOrienteering*Mapper*.AppImage

  release:
    name: Draft release
    if: github.ref_type == 'tag'
    needs: [windows, macos, linux]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            dist/*.zip
            dist/*.AppImage
          body: |
            **Unofficial build** of OpenOrienteering Mapper with experimental WMS templates via GDAL.
            This is not an OpenOrienteering release. For the official version, see https://github.com/OpenOrienteering/mapper/releases.

            Source code: this repository, tag ${{ github.ref_name }}. License: GPL-3.0.

            **Windows 10/11 (64-bit):** unzip and run `Mapper.exe`. The build is not code-signed: if Windows SmartScreen warns, choose "More info" -> "Run anyway".

            **macOS 11 or later (Apple Silicon):** unzip and move `Mapper.app` to Applications. The build is not notarized: on first start, right-click `Mapper.app` -> "Open", or allow it in System Settings -> Privacy & Security -> "Open Anyway".

            **Linux x86_64 (Ubuntu 22.04+, Linux Mint 21+, Debian 12+):** download the `.AppImage`, make it executable (`chmod +x OpenOrienteering*.AppImage`, or in the file manager: Properties -> Permissions -> "Allow executing"), and run it. Nothing is installed, and an installed `openorienteering-mapper` package is not affected. If it does not start and mentions FUSE, install `libfuse2` (Ubuntu 22.04, Mint 21, Debian 12) or `libfuse2t64` (Ubuntu 24.04, Mint 22).

            **Note:** This build can run alongside the official Mapper. Both use the same settings, so changes to preferences in one also apply to the other. This build itself runs only once: starting it again opens the given files in the running window.

            Please report problems in this repository's issues, not upstream.
